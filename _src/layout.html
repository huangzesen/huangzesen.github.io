<meta property="og:description" content="{{description}}">

<meta property="og:type" content="website">
<meta property="og:image" content="https://zesen.me/images/research/alfvenon-theta.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='12'%20fill='%23005587'/%3E%3Cpath%20d='M8%2040%20C20%2040%2024%2018%2032%2018%20C40%2018%2044%2040%2056%2040'%20stroke='%23ffb81c'%20stroke-width='5'%20fill='none'%20stroke-linecap='round'/%3E%3C/svg%3E">

<body class="page-{{slug}} {{theme}}">
<a class="skip-link" href="#main">{{skip}}</a>
<header class="site-header">
  <div class="wrapper">
    <a class="site-title" href="{{home}}">{{brand}}</a>
    <nav class="site-nav" aria-label="Main">
      <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Toggle menu">
      <label for="nav-toggle" class="menu-icon" aria-hidden="true">
        <svg viewBox="0 0 18 15"><path d="M18 1.48C18 2.3 17.34 2.97 16.52 2.97H1.48C.67 2.97 0 2.3 0 1.48S.67 0 1.48 0h15.04C17.34 0 18 .67 18 1.48z"/><path d="M18 7.52C18 8.34 17.34 9 16.52 9H1.48C.67 9 0 8.34 0 7.52s.67-1.49 1.48-1.49h15.04c.82 0 1.48.67 1.48 1.49z"/><path d="M18 13.52c0 .82-.66 1.48-1.48 1.48H1.48C.67 15 0 14.34 0 13.52s.67-1.49 1.48-1.49h15.04c.82 0 1.48.67 1.48 1.49z"/></svg>
      </label>
      <ul class="menu">
{{nav}}
      </ul>
    </nav>
    {{langswitch}}
  </div>
</header>

<section class="hero hero-{{slug}}"><canvas class="hero-canvas" aria-hidden="true"></canvas><div class="wrapper hero-inner">
{{hero}}
</div><svg class="hero-waves" viewBox="0 0 1440 80" preserveAspectRatio="none" aria-hidden="true"><path class="w1" d="M0 34 C 160 14 300 14 460 30 S 760 52 920 34 S 1220 10 1440 30 V80 H0 Z"/><path class="w2" d="M0 52 C 200 34 360 40 540 52 S 860 66 1040 50 S 1300 38 1440 50 V80 H0 Z"/><path class="w3" d="M0 66 C 180 56 380 60 560 68 S 900 76 1100 66 S 1340 60 1440 66 V80 H0 Z"/></svg></section>

<main id="main" class="page-content">
  <div class="wrapper">
{{content}}
  </div>
</main>

<footer class="site-footer">
  <div class="wrapper">
    {{footer}}
  </div>
</footer>

<script src="/js/hero-scene.js?v={{version}}" defer></script>
<script src="/js/site.js?v={{version}}" defer></script>
{{scripts}}<div id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged figure"><button type="button" aria-label="Close">×</button><img alt=""><p></p></div>
<script>
(function () {
  var box = document.getElementById('lightbox'), img = box.querySelector('img'), cap = box.querySelector('p');
  function close() { box.classList.remove('active'); }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a.lightbox-trigger');
    if (a) {
      e.preventDefault();
      img.src = a.getAttribute('href');
      img.alt = (a.querySelector('img') || {}).alt || '';
      var dd = a.closest('dl') && a.closest('dl').querySelector('dd');
      cap.textContent = dd ? dd.textContent.trim() : '';
      box.classList.add('active');
      box.querySelector('button').focus();
    } else if (e.target === box || e.target.closest('#lightbox button')) { close(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('video[autoplay]').forEach(function (v) { v.removeAttribute('autoplay'); v.pause(); v.controls = true; });
  }
})();
</script>
</body>
</html>
