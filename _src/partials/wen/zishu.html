            <h2 id="zishu-h">自述</h2>
            <p>黄泽森，字澍之，号玉兰居士，广州东山人也。蒙祖荫，生长于广州城。幼而好格物，耽读天文理数之书。束发，就学于执信；继而北上，入庐阳。及冠，渡海赴美，求学于洛城，徘徊至今。初探荧惑之天际，后究太阳之风息，辗转数载，终膺列邦司天会博士旌表。今感智械之威，慨然有志，遂辟灵台，育器灵焉。</p>
